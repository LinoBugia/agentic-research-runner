# Rolle Rater: eine Abgabe aus dem Auftrag bewerten (Format `rating` mit `submit`).
# Erwartet im Auftrag context.rate (Liste von Abgabe-Nummern).
version: 1
cost_kind: estimated
turns:
  - steps:
      - do: room
        action: get_assignment
        save_as: assignment
      - do: thinking
        text: "Ich bewerte nach Korrektheit und Originalität."
      - do: room
        action: submit
        args:
          status: done
          summary: "Tragfähig, der Randfall n = 1 fehlt noch."
          fields:
            ratings:
              - ref: "${assignment.context.rate.0}"
                score: 7.5
                comment: "Tragfähig, der Randfall n = 1 fehlt noch."
                criteria: { correctness: 8, originality: 7 }
      - do: usage
        input: 700
        output: 120
        cost_usd: 0.02
