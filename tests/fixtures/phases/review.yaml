# The start skill `proof-review` (topology `review`) as phases (docs/10 §5), test data for
# W4b-02a (A15) and later. Without a discussion the verdict of the reviews counts, so the review
# phase comes twice, switched by `discussion_rounds`; a route to the one that is dropped leads
# to the next one that stays (Entscheidung 37). `judge_memory` takes `reset`/`keep`.
kind: research-group
version: 1
description: Beweis von unabhängigen Judges prüfen lassen, mit Diskussion und Revision
topology: phases

params:
  judges:
    default: 2
    min: 1
    max: 5
    doc: "Anzahl der Judges, abwechselnd Claude und ChatGPT"
  max_revisions:
    default: 1
    min: 0
    max: 2
    doc: "Überarbeitungen des Autors, solange das Urteil nicht „accept“ ist"
  discussion_rounds:
    default: 1
    min: 0
    max: 1
    doc: "Runden in #judges nach der unabhängigen Prüfung (0: keine Diskussion)"
  verdict:
    default: majority
    choices: [majority, unanimous]
    doc: "majority: häufigstes Urteil, bei Gleichstand das strengere; unanimous: accept nur, wenn alle zustimmen"
  judge_memory:
    default: reset
    choices: [reset, keep]
    doc: "reset: Judges beginnen jede Prüfung mit neuer Sitzung und frischem Ordner; keep: sie behalten beides"
  artifact:
    default: null
    doc: "Pfad zum Beweis im Projekt, z. B. tex/beweis.tex; leer: der Autor schreibt ihn zuerst"

limits:
  wall_time: 1h
  turns_per_agent: 10
  budget_usd: 5

defaults:
  provider: claude
  model: claude-sonnet-5-5
  effort: high
  workspace: { mode: copy }

agents:
  - id: author
    role: roles/author.md
    model: claude-opus-5-5
    skills: [sympy-check, latex-writeup]
  - id: judge
    count: "{{ params.judges }}"
    role: roles/judge.md
    skills: [sympy-check]
    mix:
      - { provider: claude, model: claude-sonnet-5-5 }
      - { provider: codex }

channels:
  - name: judges
    purpose: "Diskussion der Judges nach der unabhängigen Prüfung"
    members: [judge-*]
    mode: rounds
    anonymous: true

seed:
  beweis: { file: "{{ params.artifact }}" }

phases:
  - name: fassung
    topology: solo
    when: { param: artifact, equals: null }
    actions:
      author: { task: tasks/fassung.md, submission: { format: artifact, name: beweis } }

  - name: pruefung
    topology: parallel
    when: { param: discussion_rounds, equals: 1 }
    isolated: true
    context: "{{ params.judge_memory }}"
    inputs:
      - { name: beweis, content: full }
    actions:
      judge-*: { task: tasks/pruefen.md, submission: { format: review } }

  - name: pruefung-allein
    topology: parallel
    when: { param: discussion_rounds, equals: 0 }
    isolated: true
    context: "{{ params.judge_memory }}"
    inputs:
      - { name: beweis, content: full }
    actions:
      judge-*: { task: tasks/pruefen.md, submission: { format: review } }
    gate:
      type: signal
      field: verdict
      rule: "{{ params.verdict }}"
      routes:
        accept: stop
        minor: { goto: revision }
        major: { goto: revision }
        reject: stop

  - name: diskussion
    topology: chat
    when: { param: discussion_rounds, equals: 1 }
    channels: [judges]
    rounds: "{{ params.discussion_rounds }}"
    actions:
      judge-*: { task: tasks/besprechen.md, submission: { format: review } }
    gate:
      type: signal
      field: verdict
      rule: "{{ params.verdict }}"
      routes:
        accept: stop
        minor: { goto: revision }
        major: { goto: revision }
        reject: stop

  - name: revision
    topology: solo
    max_visits: "{{ params.max_revisions }}"
    on_exhausted: stop
    actions:
      author: { task: tasks/ueberarbeiten.md, submission: { format: artifact, name: beweis } }
    gate: { type: done, routes: { done: { goto: pruefung } } }
