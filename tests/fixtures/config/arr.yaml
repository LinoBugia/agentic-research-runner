# arr.yaml from docs/02-workfolder-und-runs.md §1.1 (<gpt-modell> replaced by gpt-6.1-sol).
version: 1
defaults:
  claude: { auth: max-privat, model: claude-sonnet-5-5, effort: high }
  codex:  { auth: chatgpt-privat, model: gpt-6.1-sol, effort: high }
concurrency:                 # max. gleichzeitige Agenten pro Auth-Profil
  max-privat: 4
  chatgpt-privat: 3
limits:                      # Standard-Limits pro Run, im Run überschreibbar
  wall_time: 2h
  turns_per_agent: 40
  budget_usd: 20
user_agent_runs:
  require_approval: true     # fest (E15), nicht abschaltbar – steht hier nur zur Anzeige
toolchain:                   # Umgebung der Research-Agenten (siehe 07)
  python: ~/.venvs/mathe
  run_venv: overlay
approvals:                   # wer Berechtigungsanfragen entscheidet (siehe 07)
  decider: gatekeeper_then_user
  timeout: 20m
  gatekeeper: { model: claude-sonnet-5-5, mandate: mandates/standard.md }
permissions: {}              # Abweichungen von den Standardregeln (siehe 07, Schicht ②)
retention:
  slim_after_days: 14        # Arbeitskopien löschen, Protokolle behalten
  archive_after_days: 90
  max_runs_size_gb: 50       # Warnung in der GUI
