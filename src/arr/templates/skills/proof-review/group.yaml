kind: research-group
version: 1
description: Beweis von unabhängigen Judges prüfen lassen, mit Diskussion und Revision
topology: review

params:
  judges:
    default: 2
    min: 1
    max: 5
    doc: "Anzahl der Judges, abwechselnd Claude und ChatGPT"
  max_revisions:
    default: 1
    min: 0
    max: 2
    doc: "Überarbeitungen des Autors, solange das Urteil nicht „accept“ ist"
  discussion_rounds:
    default: 1
    min: 0
    max: 1
    doc: "Runden in #judges nach der unabhängigen Prüfung (0: keine Diskussion)"
  verdict:
    default: majority
    choices: [majority, unanimous]
    doc: "majority: häufigstes Urteil, bei Gleichstand das strengere; unanimous: accept nur, wenn alle zustimmen"
  judge_memory:
    default: fresh
    choices: [fresh, continue]
    doc: "fresh: Judges beginnen jede Prüfrunde mit neuer Sitzung; continue: sie behalten ihre Sitzung"
  artifact:
    default: null
    doc: "Pfad zum Beweis im Projekt, z. B. tex/beweis.tex; leer: der Autor schreibt ihn zuerst"

limits:
  wall_time: 1h
  turns_per_agent: 10
  budget_usd: 5

defaults:
  provider: claude
  model: claude-sonnet-5-5
  effort: high
  workspace: { mode: copy }

agents:
  - id: author
    role: roles/author.md
    model: claude-opus-5-5
    skills: [sympy-check, latex-writeup]
  - id: judge
    count: "{{ params.judges }}"
    role: roles/judge.md
    skills: [sympy-check]
    mix:
      - { provider: claude, model: claude-sonnet-5-5 }
      - { provider: codex }

groupchats:
  - name: judges
    purpose: "Diskussion der Judges nach der unabhängigen Prüfung"
    members: [judge-*]
    mode: rounds
    open_from: diskussion
    anonymous: true
