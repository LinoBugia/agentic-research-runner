name: CI

# A push or pull request that changes only documentation starts no run: the code is the
# same as in the run before. Anything not listed here (src, tests, spikes, pyproject.toml,
# uv.lock, this file) starts one.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "umsetzung/**"
      - "README.md"
      - "SECURITY.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "umsetzung/**"
      - "README.md"
      - "SECURITY.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    # Linux only: macOS runners cost ten times as much in a private repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest
